<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Stash</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="palette">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" aria-label="Search snippets" placeholder="Search snippets…" autocomplete="off" spellcheck="false" />
        <span id="count" class="muted"></span>
      </div>
      <div id="section" class="section">Pinned</div>
      <ul id="list" class="list" role="listbox" aria-label="Snippets"></ul>
      <p id="empty" class="empty" hidden>No snippets match.</p>
      <footer class="keys">
        <span><kbd>Enter</kbd> Paste</span>
        <span><kbd>Ctrl</kbd> <kbd>C</kbd> Copy only</span>
        <span><kbd>Tab</kbd> Show / hide</span>
        <span><kbd>Ctrl</kbd> <kbd>E</kbd> Edit</span>
        <span id="error" class="error"></span>
        <span class="right"><kbd>Esc</kbd> Close</span>
      </footer>
    </div>
  </body>
</html>
