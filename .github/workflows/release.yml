name: Release

# Push a tag like v0.1.0 to build the Windows installers and publish a GitHub release.
# Windows only for now: paste-back and DPAPI encryption are Windows-only (see docs/backlog.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            Write-Error "Tag $tag but package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stash ${{ github.ref_name }}"
          releaseBody: "Download `Stash_x.y.z_x64-setup.exe` (or the `.msi`) below. Windows only. Builds are not code-signed yet: on first launch SmartScreen says \"Windows protected your PC\"; click More info, then Run anyway."
          releaseDraft: false
